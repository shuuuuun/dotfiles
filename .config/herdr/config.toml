onboarding = false

[ui]
agent_panel_sort = "priority"

[theme]
name = "gruvbox"
auto_switch = false

[ui.sidebar.agents]
row_gap = 1
# タブ名は Claude Code の Stop hook（~/.claude/hooks/sync-tab-title.sh）で端末タイトルに同期している
rows = [
  ["state_icon", "machine", "workspace"],
  ["tab"],
]

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer in split"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "open file viewer in tab"

# プラグインのアクションは split / tab を開くものしかないため、popup ではバイナリを直接起動する
[[keys.command]]
key = "prefix+ctrl+f"
type = "popup"
description = "open file viewer in popup"
width = "90%"
height = "90%"
command = '''PLUGIN_DIR="$(herdr plugin list --json | jq -r '.result.plugins[] | select(.plugin_id=="herdr-file-viewer") | .plugin_root')" && CONFIG_DIR="$(herdr plugin config-dir herdr-file-viewer)" && HERDR_PLUGIN_CONFIG_DIR="$CONFIG_DIR" exec "$PLUGIN_DIR/target/release/herdr-file-viewer"'''

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle reviewr"

[[keys.command]]
key = "prefix+space"
type = "shell"
command = "~/.config/herdr/toggle-split.sh"
description = "toggle split direction of 2-pane tab"
