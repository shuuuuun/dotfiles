onboarding = false

[ui]

# >>> herdr-radar tab-bar block
tab_bar_right_separator = " · "
tab_bar_right = [
  { type = 'command', command = 'cat "/Users/motoki-shun/.local/state/herdr/plugins/hhdebb.herdr-radar/tabbar${HERDR_SESSION:+-$HERDR_SESSION}.txt"', interval_seconds = 6, timeout_seconds = 2 },
]
# <<< herdr-radar tab-bar block

agent_panel_sort = "priority"

[keys]
zoom = ["prefix+z", "alt+z"]

[theme]
name = "gruvbox"
dark_name = "gruvbox"
light_name = "gruvbox-light"
auto_switch = false

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer in split"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "open file viewer in tab"

# プラグインのアクションは split / tab を開くものしかないため、popup ではバイナリを直接起動する
[[keys.command]]
key = "prefix+ctrl+f"
type = "popup"
description = "open file viewer in popup"
width = "90%"
height = "90%"
command = '''PLUGIN_DIR="$(herdr plugin list --json | jq -r '.result.plugins[] | select(.plugin_id=="herdr-file-viewer") | .plugin_root')" && CONFIG_DIR="$(herdr plugin config-dir herdr-file-viewer)" && HERDR_PLUGIN_CONFIG_DIR="$CONFIG_DIR" exec "$PLUGIN_DIR/target/release/herdr-file-viewer"'''

# reviewr の overlay は herdr 0.9.3 では幅・高さを指定できないため、popup でバイナリを直接起動する
# reviewr は HERDR_PANE_ID を自分のペインとみなし送信先から除外するため、popup では渡さない
[[keys.command]]
key = "prefix+ctrl+d"
type = "popup"
description = "open reviewr in popup"
width = "90%"
height = "90%"
command = '''PLUGIN_DIR="$(herdr plugin list --json | jq -r '.result.plugins[] | select(.plugin_id=="persiyanov.reviewr") | .plugin_root')" && CONFIG_DIR="$(herdr plugin config-dir persiyanov.reviewr)" && cd "$(~/.config/herdr/popup-cwd.sh)" && exec env -u HERDR_PANE_ID HERDR_WORKSPACE_ID="$HERDR_ACTIVE_WORKSPACE_ID" HERDR_PLUGIN_ROOT="$PLUGIN_DIR" HERDR_PLUGIN_CONFIG_DIR="$CONFIG_DIR" "$PLUGIN_DIR/bin/herdr-reviewr"'''

[[keys.command]]
key = "prefix+shift+space"
type = "shell"
command = "~/.config/herdr/toggle-split.sh"
description = "toggle split direction of 2-pane tab"

[[keys.command]]
key = "prefix+space"
type = "shell"
command = "~/.config/herdr/quicklook.sh"
description = "open selected path in Quick Look"

[[keys.command]]
key = "prefix+ctrl+t"
type = "popup"
description = "open tig in popup"
width = "90%"
height = "90%"
command = '''cd "$(~/.config/herdr/popup-cwd.sh)" && exec tig'''

[[keys.command]]
key = "prefix+ctrl+s"
type = "popup"
description = "open shell in popup"
width = "90%"
height = "90%"
command = '''cd "$(~/.config/herdr/popup-cwd.sh)" && exec "${SHELL:-zsh}"'''

# >>> herdr-radar theme block
[theme.custom]
active_row_bg = "#414868"
# <<< herdr-radar theme block

